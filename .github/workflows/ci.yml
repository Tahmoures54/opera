name: OPERA CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . --select E4,E7,E9,F --ignore E401,E402,E701,E702,F401
      - name: Mypy
        run: mypy --config-file mypy.ini app.py extensions.py config blueprints
      - name: Ensure migrations are not coupled to Vercel builds
        run: python -c "import json; assert 'buildCommand' not in json.load(open('vercel.json', encoding='utf-8'))"
      - name: Validate operational shell scripts
        run: bash -n scripts/prod_up.sh scripts/backup_postgres.sh scripts/restore_postgres.sh scripts/restore_evidence.sh
      - name: Pytest with core coverage
        run: pytest --cov=app.py --cov=blueprints/health.py --cov=blueprints/growth.py --cov=config/config.py --cov=extensions.py --cov=forms --cov=models.py --cov=models_commissioning.py --cov=errors.py --cov=data/country_codes.py --cov-report=term-missing --cov-fail-under=80
      - name: Test OPERA commissioning coverage
        run: >-
          pytest -q tests/test_commissioning_*.py tests/test_evidence_archive_validation.py
          --cov=models_commissioning
          --cov=blueprints/commissioning
          --cov-report=term-missing
          --cov-fail-under=58
      - name: Bandit
        run: bandit -r . -x ./tests,./migrations
      - name: pip-audit
        run: pip-audit -r requirements.txt

  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opera
          POSTGRES_USER: opera
          POSTGRES_PASSWORD: opera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opera -d opera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FLASK_ENV: production
      SECRET_KEY: ci-only-opera-secret-key-0123456789
      DATABASE_URL: postgresql://opera:opera@127.0.0.1:5432/opera
      RATELIMIT_STORAGE_URI: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run production migrations on empty PostgreSQL
        run: VERCEL_ENV=production python scripts/vercel_migrate.py
      - name: Test concurrent recovery replay and CheckSheet numbering on PostgreSQL
        run: pytest -q tests/test_account_recovery_postgres.py tests/test_commissioning_number_service.py
      - name: Verify forward upgrade from previous schema revision
        env:
          DATABASE_URL: postgresql://opera:opera@127.0.0.1:5432/opera_upgrade
        run: |
          python - <<'PY'
          import psycopg2
          connection = psycopg2.connect(
              dbname="postgres",
              user="opera",
              password="opera",
              host="127.0.0.1",
          )
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  cursor.execute("CREATE DATABASE opera_upgrade")
          finally:
              connection.close()
          PY
          flask --app wsgi db upgrade 20260922_0015
          flask --app wsgi db upgrade
          flask --app wsgi db current
      - name: Verify PostgreSQL backup and isolated restore
        env:
          PGPASSWORD: opera
        run: |
          docker run --rm --network host -e PGPASSWORD="$PGPASSWORD" -v "$RUNNER_TEMP:/backup" postgres:16-alpine sh -ec '
            pg_dump -h 127.0.0.1 -U opera -d opera --format=custom -f /backup/opera-ci.dump
            createdb -h 127.0.0.1 -U opera opera_restore_test
            pg_restore -h 127.0.0.1 -U opera -d opera_restore_test --no-owner --no-privileges /backup/opera-ci.dump
            restored_revision="$(psql -h 127.0.0.1 -U opera -d opera_restore_test -Atc "SELECT version_num FROM alembic_version")"
            test "$restored_revision" = "20261117_0021"
            psql -h 127.0.0.1 -U opera -d opera_restore_test -Atc "SELECT count(*) FROM account_recovery_token" | grep -q "^0$"
            echo "PostgreSQL dump/restore round trip passed."
          '
      - name: Smoke test production app, readiness and public funnel
        run: |
          python - <<'PY'
          from wsgi import app
          client = app.test_client()
          assert client.get("/health/live").status_code == 200
          ready = client.get("/health/ready")
          assert ready.status_code == 200, ready.get_data(as_text=True)
          assert client.get("/").status_code == 200
          assert client.get("/demo").status_code == 200
          assert client.get("/pricing").status_code == 200
          assert client.get("/contact").status_code == 200
          assert client.get("/robots.txt").status_code == 200
          assert client.get("/sitemap.xml").status_code == 200
          print("Production PostgreSQL/Redis smoke test passed.")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: |
          mkdir -p secrets
          printf 'ci-only-password' > secrets/postgres_password
          printf 'ci-only-cert' > secrets/tls_cert
          printf 'ci-only-key' > secrets/tls_key
          cp .env.prod.example .env.prod
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-only-opera-secret-key-0123456789abcdef/' .env.prod
          docker compose --env-file .env.prod -f docker-compose.production.yml config --quiet
      - name: Validate Nginx configuration
        run: |
          mkdir -p "$RUNNER_TEMP/nginx-tls"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/nginx-tls/tls_key" \
            -out "$RUNNER_TEMP/nginx-tls/tls_cert" \
            -subj "/CN=localhost"
          docker run --rm --add-host web:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$RUNNER_TEMP/nginx-tls/tls_cert:/run/secrets/tls_cert:ro" \
            -v "$RUNNER_TEMP/nginx-tls/tls_key:/run/secrets/tls_key:ro" \
            nginx:1.27-alpine nginx -t
      - name: Build production image
        run: docker build -f Dockerfile.production -t opera:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opera:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

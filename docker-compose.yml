services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      RATELIMIT_STORAGE_URI: memory://
      DATABASE_URL: postgresql://${POSTGRES_USER:-opera_dev}:${POSTGRES_PASSWORD:-opera_local_only}@db:5432/${POSTGRES_DB:-opera_dev}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opera_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opera_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-opera_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opera_dev} -d ${POSTGRES_DB:-opera_dev}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:

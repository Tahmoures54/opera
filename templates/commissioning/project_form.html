{% extends 'base.html' %}
{% block title %} | OPERA - ایجاد پروژه{% endblock %}
{% block content %}
<div class="container py-4" dir="rtl"><div class="mb-4"><a href="{{ url_for('commissioning.dashboard') }}">بازگشت به OPERA</a><h1 class="h3 mt-2">{{ "ویرایش پروژه کمیسیونینگ" if project else "ایجاد پروژه کمیسیونینگ" }}</h1></div>
<form method="post" class="card"><div class="card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-4"><label class="form-label">کد پروژه *</label><input class="form-control" name="project_code" maxlength="50" required value="{{ project.project_code if project else '' }}" {{ 'readonly' if project else '' }}></div>
<div class="col-md-8"><label class="form-label">نام پروژه *</label><input class="form-control" name="name" maxlength="200" required value="{{ project.name if project else '' }}"></div>
<div class="col-md-6"><label class="form-label">کارفرما</label><input class="form-control" name="client" value="{{ project.client if project else '' }}"></div><div class="col-md-6"><label class="form-label">پیمانکار</label><input class="form-control" name="contractor" value="{{ project.contractor if project else '' }}"></div>
<div class="col-md-6"><label class="form-label">تاریخ شروع</label><input class="form-control" type="date" name="start_date" value="{{ project.start_date.isoformat() if project and project.start_date else '' }}"></div><div class="col-md-6"><label class="form-label">تاریخ هدف پایان</label><input class="form-control" type="date" name="target_end_date" value="{{ project.target_end_date.isoformat() if project and project.target_end_date else '' }}"></div>
<div class="col-12"><label class="form-label">توضیحات</label><textarea class="form-control" name="description" rows="3">{{ project.description if project else '' }}</textarea></div></div></div><div class="card-footer bg-white d-flex gap-2"><button class="btn btn-primary" type="submit">{{ "ذخیره تغییرات" if project else "ذخیره پروژه" }}</button><a class="btn btn-light" href="{{ url_for('commissioning.dashboard') }}">انصراف</a></div></form></div>
{% endblock %}

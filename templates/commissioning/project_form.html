{% extends 'base.html' %}
{% block title %} | OPERA - Create project{% endblock %}
{% block content %}
<div class="container py-4"><div class="mb-4"><a href="{{ url_for('commissioning.dashboard') }}">Back to OPERA</a><h1 class="h3 mt-2">{{ "Edit commissioning project" if project else "Create a commissioning project" }}</h1></div>
<form method="post" class="card"><div class="card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-4"><label class="form-label">Project code *</label><input class="form-control" name="project_code" maxlength="50" required value="{{ project.project_code if project else '' }}" {{ 'readonly' if project else '' }}></div>
<div class="col-md-8"><label class="form-label">Project name *</label><input class="form-control" name="name" maxlength="200" required value="{{ project.name if project else '' }}"></div>
<div class="col-md-6"><label class="form-label">Client</label><input class="form-control" name="client" value="{{ project.client if project else '' }}"></div><div class="col-md-6"><label class="form-label">Contractor</label><input class="form-control" name="contractor" value="{{ project.contractor if project else '' }}"></div>
<div class="col-md-6"><label class="form-label">Start date</label><input class="form-control" type="date" name="start_date" value="{{ project.start_date.isoformat() if project and project.start_date else '' }}"></div><div class="col-md-6"><label class="form-label">Target completion date</label><input class="form-control" type="date" name="target_end_date" value="{{ project.target_end_date.isoformat() if project and project.target_end_date else '' }}"></div>
<div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="3">{{ project.description if project else '' }}</textarea></div></div></div><div class="card-footer bg-white d-flex gap-2"><button class="btn btn-primary" type="submit">{{ "Save changes" if project else "Save project" }}</button><a class="btn btn-light" href="{{ url_for('commissioning.dashboard') }}">Cancel</a></div></form></div>
{% endblock %}

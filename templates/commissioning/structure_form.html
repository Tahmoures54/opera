{% extends 'base.html' %}
{% block title %} | OPERA - ساختار پروژه{% endblock %}
{% block content %}
<div class="container py-4" dir="rtl"><a href="{{ url_for('commissioning.project_detail', project_id=project.id) }}">بازگشت به پروژه</a><h1 class="h3 mt-2">{% if edit %}ویرایش{% else %}افزودن{% endif %} {% if kind == 'system' %}سیستم{% else %}زیرسیستم{% endif %}</h1>
<form method="post" class="card"><div class="card-body"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3">
<div class="col-md-4"><label class="form-label">{% if kind == 'system' %}کد سیستم *{% else %}کد زیرسیستم *{% endif %}</label><input class="form-control" name="{{ 'system_code' if kind == 'system' else 'subsystem_code' }}" required maxlength="50" value="{{ (system.system_code if kind == 'system' and system else subsystem.subsystem_code if subsystem else '') }}" {{ 'readonly' if edit else '' }}></div>
<div class="col-md-8"><label class="form-label">نام *</label><input class="form-control" name="name" required maxlength="200" value="{{ (system.name if kind == 'system' and system else subsystem.name if subsystem else '') }}"></div>
{% if kind == 'system' %}<div class="col-md-6"><label class="form-label">مرجع P&amp;ID</label><input class="form-control" name="p_and_id_ref" value="{{ system.p_and_id_ref if system else '' }}"></div>{% else %}<div class="col-md-6"><label class="form-label">تاریخ هدف MC</label><input class="form-control" type="date" name="mc_target_date" value="{{ subsystem.mc_target_date.isoformat() if subsystem and subsystem.mc_target_date else '' }}"></div><div class="col-md-6"><label class="form-label">تاریخ هدف RF</label><input class="form-control" type="date" name="rf_target_date" value="{{ subsystem.rf_target_date.isoformat() if subsystem and subsystem.rf_target_date else '' }}"></div>{% endif %}
<div class="col-md-4"><label class="form-label">وزن (%)</label><input class="form-control" type="number" min="0" max="100" step="0.01" name="weight_percent" value="{{ system.weight_percent if kind == 'system' and system else subsystem.weight_percent if subsystem else 0 }}"></div><div class="col-12"><label class="form-label">توضیحات</label><textarea class="form-control" name="description" rows="3">{{ (system.description if kind == 'system' and system else subsystem.description if subsystem else '') }}</textarea></div></div></div><div class="card-footer bg-white"><button class="btn btn-primary">{{ "ذخیره تغییرات" if edit else "ذخیره" }}</button></div></form></div>
{% endblock %}
